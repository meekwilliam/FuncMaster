name: Windows build

on:
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller==6.22.3

      - name: Build imsomeeked.exe
        run: >
          pyinstaller --noconfirm --onefile --console --hide-console hide-early --name imsomeeked
          --add-data "web;web"
          --collect-all pymobiledevice3
          --collect-all developer_disk_image
          --collect-all pmd_pytcp
          --collect-all pytun_pmd3
          --collect-all ipsw_parser
          --collect-all pyimg4
          --recursive-copy-metadata pymobiledevice3
          imsomeeked.py

      - name: Self-test the build
        shell: pwsh
        run: |
          # A console build that hides its window at startup, so import errors print here instead of a dialog.
          $p = Start-Process -FilePath dist\imsomeeked.exe -ArgumentList "--selftest" -NoNewWindow -PassThru `
            -RedirectStandardOutput selftest.out -RedirectStandardError selftest.err
          $null = $p.Handle  # needed for ExitCode to be filled in
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Host "Self-test timed out"; Get-Content selftest.out, selftest.err; exit 1 }
          Get-Content selftest.out, selftest.err
          Get-Content "$env:APPDATA\imsomeeked\selftest.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: imsomeeked-windows
          path: windows/dist/imsomeeked.exe
