name: Windows build

on:
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller==6.22.3

      - name: Build changemylocation.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --splash splash.png --icon icon.ico --name changemylocation
          --add-data "web;web"
          --collect-all pymobiledevice3
          --collect-all developer_disk_image
          --collect-all pmd_pytcp
          --collect-all pytun_pmd3
          --collect-all ipsw_parser
          --collect-all pyimg4
          --recursive-copy-metadata pymobiledevice3
          changemylocation.py

      - name: Self-test the build
        shell: pwsh
        run: |
          # The exe has no console, so it writes its result to selftest.txt (printed below).
          $p = Start-Process -FilePath dist\changemylocation.exe -ArgumentList "--selftest" -NoNewWindow -PassThru `
            -RedirectStandardOutput selftest.out -RedirectStandardError selftest.err
          $null = $p.Handle  # needed for ExitCode to be filled in
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Host "Self-test timed out"; Get-Content selftest.out, selftest.err; exit 1 }
          Get-Content selftest.out, selftest.err
          Get-Content "$env:APPDATA\changemylocation\selftest.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { exit 1 }

      # The .exe bundles GPL-3.0 libraries (pymobiledevice3 and friends), so ship the GPL text and every bundled
      # package's license next to it.
      - name: Collect third-party licenses
        run: |
          pip install pip-licenses==5.5.5
          pip-licenses --with-urls --with-license-file --no-license-path --format=plain-vertical --output-file dist/THIRD_PARTY_LICENSES.txt
          copy COPYING.GPL-3.0.txt dist\

      - uses: actions/upload-artifact@v4
        with:
          name: changemylocation-windows
          path: |
            windows/dist/changemylocation.exe
            windows/dist/THIRD_PARTY_LICENSES.txt
            windows/dist/COPYING.GPL-3.0.txt
